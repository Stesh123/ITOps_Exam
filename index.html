<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITOps Exam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'primary': '#4f46e5',
                            'secondary': '#1f2937',
                            'background': '#0f172a',
                            'card': '#1e293b',
                            'text-light': '#f1f5f9',
                            'text-secondary': '#94a3b8',
                            'selection': '#334155',
                            'error-text': '#f87171',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
        .btn-primary {
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 15px rgba(79,70,229,.4);
            transition: all .3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #4f46e5, #3730a3);
            box-shadow: 0 6px 20px rgba(79,70,229,.6);
            transform: translateY(-2px);
        }
        .btn-primary:disabled, .btn-primary[disabled]{
            background:#334155; box-shadow:none; transform:none; cursor:not-allowed; opacity:.6;
        }
    </style>
</head>
<body class="bg-background text-text-light min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl">
        <h1 class="text-4xl font-extrabold text-center text-primary mb-10 tracking-wide">ITOps Exam</h1>
        
        <div class="text-center mb-4 text-text-secondary text-xs italic">
            Powered by the brilliant mind - Stas Shnaider, ITOps genius.
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <h2 class="text-2xl font-semibold mb-4 text-primary">Full Name</h2>
            <p class="text-text-secondary mb-6">Enter the employee's name to begin the technical assessment.</p>

            <input type="text" id="employee-name-input" placeholder="Enter Employee Full Name (Required)" 
                   class="w-full p-3 mb-6 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none">

            <p id="start-status" class="mt-4 text-center text-sm text-error-text h-5"></p>

            <button onclick="exam.checkNameAndStart()" class="btn-primary w-full text-text-light font-semibold py-3 rounded-lg shadow-lg mt-4">
                Start Exam
            </button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 class="text-xl font-semibold text-primary" id="question-number">Question 1/X</h2>
                <span id="current-score" class="text-base font-medium text-text-secondary px-3 py-1 bg-slate-700/50 rounded-full">Score: Hidden</span>
            </div>
            <div class="mb-10">
                <p id="question-text" class="text-2xl font-light mb-3"></p>
                <p id="question-category" class="text-sm text-primary/70 italic"></p>
            </div>

            <div id="options-container" class="space-y-4"></div>

            <div id="fill-in-container" class="space-y-4 hidden">
                <input type="text" id="answer-input" placeholder="Type your answer here..."
                       class="w-full p-4 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none text-xl">
            </div>

            <p id="answer-error" class="text-error-text text-sm h-5 text-center"></p>

            <div class="mt-8 flex justify-between space-x-4">
                <button id="prev-btn" onclick="exam.goToPrevQuestion()"
                        class="bg-slate-600 hover:bg-slate-500 text-text-light font-semibold py-3 px-6 rounded-lg transition disabled:opacity-50"
                        disabled>Previous</button>
                <button id="next-btn" onclick="exam.checkAnswerAndAdvance()"
                        class="btn-primary text-text-light font-semibold py-3 px-6 rounded-lg shadow-lg transition disabled:opacity-50"
                        disabled>Next Question</button>
            </div>
        </div>

        <!-- RESULTS SCREEN -->
        <div id="results-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <h2 class="text-3xl font-bold text-primary mb-3 text-center" id="results-title">Exam Completed</h2>
            <p class="text-lg text-text-secondary mb-8 text-center">Final Overall Score</p>

            <div class="p-6 bg-slate-800/50 rounded-xl mb-8 text-center">
                <p class="text-xl font-medium text-text-secondary">Overall Score:</p>
                <div class="text-7xl font-extrabold text-white mt-1" id="final-score-display">--/--</div>
            </div>

            <div class="mb-10 pt-4 flex space-x-4 justify-center">
                <button onclick="exam.printRecap()" class="btn-primary text-text-light font-semibold py-3 px-6 rounded-lg transition">
                    Print Summary (Detailed Recap)
                </button>
                <button onclick="exam.resetApp()" class="bg-slate-600 hover:bg-slate-500 text-text-light font-semibold py-3 px-6 rounded-lg shadow-lg transition">
                    Restart
                </button>
            </div>

            <div id="recap-container" class="hidden"></div>
        </div>
    </div>

    <!-- ====================== MODULE SCRIPT WITH ALL QUESTIONS ====================== -->
    <script type="module">
        // ---------- Firebase ----------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVDZPURarcDmSZTsQTUIs_8VxNLQrkSmc",
            authDomain: "examitops.firebaseapp.com",
            projectId: "examitops",
            storageBucket: "examitops.firebasestorage.app",
            messagingSenderId: "605108026221",
            appId: "1:605108026221:web:ad7f3147f5645c11cc3864",
            measurementId: "G-Y70D2ZDQHZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // ---------- ALL 24 QUESTIONS (FULLY RESTORED) ----------
        const questions = [
            // ================= IT ARCHITECT =================
            { Category: 'IT Architect', Question: 'Which architecture pattern improves scalability by decoupling producers and consumers using an asynchronous backbone?', A: 'SOA', B: 'CQRS', C: 'Event-Driven Architecture', D: 'Pipe-and-Filter', CorrectAnswer: 'C' },
            { Category: 'IT Architect', Question: 'Name the architectural pattern where write and read operations are separated into different models.', A: '', B: '', C: '', D: '', CorrectAnswer: 'CQRS' },

            // ================= LINUX =================
            { Category: 'Linux', Question: 'Which kernel feature enables running containers by providing isolated namespaces and control groups?', A: 'SELinux', B: 'systemd', C: 'Kernel Isolation', D: 'cgroups + namespaces', CorrectAnswer: 'D' },
            { Category: 'Linux', Question: 'Name the Linux scheduling class designed for real-time workloads.', A: '', B: '', C: '', D: '', CorrectAnswer: 'SCHED_FIFO' },

            // ================= VMWARE =================
            { Category: 'VMware', Question: 'Which VMware feature provides continuous availability for a VM by maintaining a secondary VM that mirrors the primary in real time?', A: 'HA', B: 'vMotion', C: 'Fault Tolerance (FT)', D: 'DRS', CorrectAnswer: 'C' },
            { Category: 'VMware', Question: 'Name the VMware component used to manage lifecycle operations such as upgrades, patches, and firmware management.', A: '', B: '', C: '', D: '', CorrectAnswer: 'Lifecycle Manager (vLCM)' },

            // ================= NETWORK =================
            { Category: 'Network', Question: 'Which routing protocol uses Dijkstra’s SPF algorithm and supports areas for scalability?', A: 'RIP', B: 'BGP', C: 'EIGRP', D: 'OSPF', CorrectAnswer: 'D' },
            { Category: 'Network', Question: 'Name the BGP attribute that determines the preferred exit point from an AS.', A: '', B: '', C: '', D: '', CorrectAnswer: 'LOCAL_PREF' },
        ];

        // ---------- Global State ----------
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let employeeName = '';
        let score = 0;

        const KEYS = { QUESTION:'Question', CATEGORY:'Category', A:'A', B:'B', C:'C', D:'D', CORRECT:'CorrectAnswer' };

        // ---------- DOM ----------
        const startScreen   = document.getElementById('start-screen');
        const quizScreen    = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const startStatus   = document.getElementById('start-status');
        const nextButton    = document.getElementById('next-btn');
        const prevButton    = document.getElementById('prev-btn');
        const answerInput   = document.getElementById('answer-input');

        // ---------- Helper ----------
        function calculateFinalScore() {
            return userAnswers.reduce((s, a) => s + (a.isCorrect ? 1 : 0), 0);
        }

        // ---------- Expose Functions Globally ----------
        const exam = {
            checkNameAndStart,
            startQuiz,
            goToPrevQuestion,
            checkAnswerAndAdvance,
            showResults,
            printRecap,
            resetApp
        };
        window.exam = exam;

        // ----- START -----
        function checkNameAndStart() {
            const name = document.getElementById('employee-name-input').value.trim();
            if (!name) { startStatus.textContent = "Error: Please enter the employee's full name."; return; }
            employeeName = name;
            startStatus.textContent = '';
            exam.startQuiz();
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            userAnswers = questions.map(q => ({
                question: q[KEYS.QUESTION],
                category: q[KEYS.CATEGORY],
                isMCQ: !!q[KEYS.A].trim(),
                options: { A:q[KEYS.A], B:q[KEYS.B], C:q[KEYS.C], D:q[KEYS.D] },
                selected: null,
                correct: q[KEYS.CORRECT],
                isCorrect: false
            }));

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            displayQuestion();
        }

        // ----- DISPLAY -----
        function displayQuestion() {
            if (currentQuestionIndex >= questions.length) { exam.showResults(); return; }

            const q = questions[currentQuestionIndex];
            const attempt = userAnswers[currentQuestionIndex];
            const total = questions.length;

            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex+1}/${total}`;
            document.getElementById('question-text').textContent   = q[KEYS.QUESTION];
            document.getElementById('question-category').textContent = q[KEYS.CATEGORY] ? `Category: ${q[KEYS.CATEGORY]}` : 'Category: General';

            const opts = document.getElementById('options-container');
            const fill = document.getElementById('fill-in-container');
            const err  = document.getElementById('answer-error');

            opts.innerHTML = '';
            answerInput.value = '';
            err.textContent = '';

            if (attempt.isMCQ) {
                opts.classList.remove('hidden'); fill.classList.add('hidden');
                ['A','B','C','D'].forEach(k => {
                    if (!q[k]) return;
                    const btn = document.createElement('button');
                    btn.textContent = `${k}. ${q[k]}`;
                    btn.className = `option-button w-full text-left p-4 rounded-lg bg-slate-700 hover:bg-primary/50 transition shadow-md font-medium`;
                    if (attempt.selected === k) btn.className = `option-button w-full text-left p-4 rounded-lg bg-selection ring-2 ring-primary/50 transition shadow-md font-medium`;
                    btn.onclick = () => selectMCQAnswer(k);
                    btn.id = `option-${k}`;
                    opts.appendChild(btn);
                });
            } else {
                opts.classList.add('hidden'); fill.classList.remove('hidden');
                if (attempt.selected !== null) answerInput.value = attempt.selected;
                answerInput.oninput = submitFillInAnswer;
            }

            updateNextButtonState();
            updateNavigationButtons();
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentQuestionIndex === 0;
            nextButton.textContent = currentQuestionIndex === questions.length-1 ? 'Finish Exam' : 'Next Question';
        }

        function updateNextButtonState() {
            const a = userAnswers[currentQuestionIndex];
            nextButton.disabled = !a || a.selected === null || a.selected.toString().trim() === '';
        }

        // ----- ANSWER HANDLING -----
        function selectMCQAnswer(key) {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            attempt.selected = key;
            attempt.isCorrect = key === q[KEYS.CORRECT];

            document.querySelectorAll('.option-button').forEach(b => {
                b.classList.remove('bg-selection','ring-2','ring-primary/50');
                b.classList.add('bg-slate-700','hover:bg-primary/50');
            });
            const sel = document.getElementById(`option-${key}`);
            if (sel) sel.classList.add('bg-selection','ring-2','ring-primary/50');

            updateNextButtonState();
        }

        function submitFillInAnswer() {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            const txt = answerInput.value.trim();
            attempt.selected = txt;
            if (txt) {
                const norm = txt.toLowerCase();
                const correct = q[KEYS.CORRECT].split('|').map(c=>c.trim().toLowerCase());
                attempt.isCorrect = correct.includes(norm);
            } else {
                attempt.isCorrect = false;
            }
            document.getElementById('answer-error').textContent = '';
            updateNextButtonState();
        }

        // ----- NAVIGATION -----
        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; displayQuestion(); }
        }

        function checkAnswerAndAdvance() {
            const attempt = userAnswers[currentQuestionIndex];
            if (!attempt || attempt.selected === null || attempt.selected.toString().trim() === '') {
                document.getElementById('answer-error').textContent = attempt.isMCQ ?
                    'Please select an answer before moving to the next question.' :
                    'Please enter an answer before moving to the next question.';
                return;
            }
            document.getElementById('answer-error').textContent = '';
            if (currentQuestionIndex < questions.length-1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                exam.showResults();
            }
        }

        // ----- RESULTS & FIREBASE -----
        async function sendResultsToDatabase() {
            const finalScore = calculateFinalScore();
            const total = questions.length;
            const percentage = total ? ((finalScore/total)*100).toFixed(1) : 0;
            const data = {
                employeeName,
                score: finalScore,
                total,
                percentage,
                timestamp: new Date().toISOString(),
                answers: userAnswers.map(a=>({
                    question: a.question,
                    category: a.category,
                    selected: a.selected,
                    correct: a.correct,
                    isCorrect: a.isCorrect
                }))
            };
            try {
                await addDoc(collection(db, "examResults"), data);
                console.log("Results saved to Firestore");
            } catch (e) {
                console.error("Firestore error:", e);
                alert("Could not save results – check console.");
            }
        }

        function showResults() {
            const finalScore = calculateFinalScore();
            const total = questions.length;
            score = finalScore;

            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            document.getElementById('final-score-display').textContent = `${finalScore}/${total}`;

            const box = document.querySelector('#final-score-display').parentNode;
            let nameEl = document.getElementById('employee-name-display');
            if (nameEl) nameEl.remove();
            nameEl = document.createElement('p');
            nameEl.id = 'employee-name-display';
            nameEl.className = 'text-2xl font-bold text-text-light mb-2';
            nameEl.textContent = employeeName;
            box.insertBefore(nameEl, box.firstElementChild);

            sendResultsToDatabase();
        }

        function printRecap() {
            const total = questions.length;
            const finalScore = calculateFinalScore();
            const perc = total ? ((finalScore/total)*100).toFixed(1) : 0;
            const date = new Date().toISOString().slice(0,10);
            const file = `${employeeName.replace(/[^a-zA-Z0-9\s]/g,'').trim().replace(/\s+/g,'_')}_Assessment_Summary_${date}`;

            let html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${file}</title>
<style>
body{font-family:sans-serif;margin:30px;color:#212121;}
h1{color:#4f46e5;border-bottom:2px solid #ddd;padding-bottom:10px;}
.score-box{border:1px solid #ccc;padding:15px;margin-bottom:20px;text-align:center;}
.score-number{font-size:3em;font-weight:bold;}
.question-item{border:1px solid #ddd;padding:15px;margin-top:15px;border-radius:8px;page-break-inside:avoid;}
.question-text{font-weight:bold;margin-bottom:10px;}
.option-div{padding:5px;border-radius:4px;margin-bottom:4px;}
.option-correct-choice{background:#d4edda;border:1px solid #c3e6cb;}
.option-incorrect-choice{background:#f8d7da;border:1px solid #f5c6cb;}
.option-correct-answer{background:#e2f0d4;border:1px solid #c9e0b1;}
.prefix-correct{color:#155724;font-weight:bold;}
.prefix-incorrect{color:#721c24;font-weight:bold;}
</style></head><body>
<h1>Tier 3 Assessment Summary for ${employeeName}</h1>
<div class="score-box"><h2>Overall Score:</h2><div class="score-number">${finalScore}/${total}</div>
<p>Percentage: ${perc}%</p><p>Date: ${new Date().toLocaleDateString('en-US')}</p></div>
<h2>Detailed Exam Recap</h2>`;

            userAnswers.forEach((a, i) => {
                let block = `<div class="question-item"><p class="question-text">${i+1}. ${a.question}</p>`;
                if (a.isMCQ) {
                    Object.keys(a.options).forEach(k => {
                        if (!a.options[k]) return;
                        let cls = '', pref = '';
                        if (k===a.selected && a.isCorrect) { cls='option-correct-choice'; pref='<span class="prefix-correct">CORRECT CHOICE:</span> '; }
                        else if (k===a.selected && !a.isCorrect) { cls='option-incorrect-choice'; pref='<span class="prefix-incorrect">YOUR CHOICE:</span> '; }
                        else if (k===a.correct) { cls='option-correct-answer'; pref='<span class="prefix-correct">CORRECT ANSWER:</span> '; }
                        block += `<div class="option-div ${cls}">${k}. ${pref}${a.options[k]}</div>`;
                    });
                } else {
                    const sel = a.selected || "No Answer Given";
                    if (a.isCorrect) {
                        block += `<div class="option-div option-correct-choice"><span class="prefix-correct">YOUR ANSWER (Correct):</span> ${sel}</div>`;
                    } else {
                        block += `<div class="option-div option-incorrect-choice"><span class="prefix-incorrect">YOUR ANSWER (Incorrect):</span> ${sel}</div>
                                  <div class="option-div option-correct-answer"><span class="prefix-correct">CORRECT ANSWER(S):</span> ${a.correct.split('|').join(', ')}</div>`;
                    }
                }
                block += `</div>`;
                html += block;
            });

            html += `</body></html>`;
            const win = window.open('', '', 'height=600,width=800');
            win.document.title = file;
            win.document.write(html);
            win.document.close();
            win.print();
        }

        function resetApp() {
            currentQuestionIndex = 0; score = 0; userAnswers = []; employeeName = '';
            resultsScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startStatus.textContent = '';
            document.getElementById('employee-name-input').value = '';
            const nameEl = document.getElementById('employee-name-display');
            if (nameEl) nameEl.remove();
        }
    </script>
</body>
</html>
