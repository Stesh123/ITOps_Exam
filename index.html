<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITOps Exam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'primary': '#4f46e5',
                            'secondary': '#1f2937',
                            'background': '#0f172a',
                            'card': '#1e293b',
                            'text-light': '#f1f5f9',
                            'text-secondary': '#94a3b8',
                            'selection': '#334155',
                            'error-text': '#f87171',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
        .btn-primary {
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 15px rgba(79,70,229,.4);
            transition: all .3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #4f46e5, #3730a3);
            box-shadow: 0 6px 20px rgba(79,70,229,.6);
            transform: translateY(-2px);
        }
        .btn-primary:disabled, .btn-primary[disabled]{
            background:#334155; box-shadow:none; transform:none; cursor:not-allowed; opacity:.6;
        }
    </style>
</head>
<body class="bg-background text-text-light min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl">
        <h1 class="text-4xl font-extrabold text-center text-primary mb-10 tracking-wide">ITOps Exam</h1>
        
        <div class="text-center mb-4 text-text-secondary text-xs italic">
            Powered by the brilliant mind - Stas Shnaider, ITOps genius.
        </div>

        <div id="start-screen" class="bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <h2 class="text-2xl font-semibold mb-4 text-primary">Full Name</h2>
            <p class="text-text-secondary mb-6">Enter the employee's name and upload the question file to begin the assessment.</p>

            <input type="text" id="employee-name-input" placeholder="Enter Employee Full Name (Required)" 
                    class="w-full p-3 mb-4 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none">
            
            <label for="csv-upload" class="block text-text-light mb-2 font-medium">Upload Questions CSV (Required)</label>
            <input type="file" id="csv-upload" accept=".csv"
                    class="w-full p-3 mb-6 block rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary/20 file:text-primary hover:file:bg-primary/30">

            <p id="start-status" class="mt-4 text-center text-sm text-error-text h-5"></p>

            <button onclick="exam.checkNameAndStart()" class="btn-primary w-full text-text-light font-semibold py-3 rounded-lg shadow-lg mt-4">
                Start Exam
            </button>
        </div>

        <div id="quiz-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 class="text-xl font-semibold text-primary" id="question-number">Question 1/X</h2>
                <span id="current-score" class="text-base font-medium text-text-secondary px-3 py-1 bg-slate-700/50 rounded-full">Score: Hidden</span>
            </div>
            <div class="mb-10">
                <p id="question-text" class="text-2xl font-light mb-3"></p>
                <p id="question-category" class="text-sm text-primary/70 italic"></p>
            </div>

            <div id="options-container" class="space-y-4"></div>

            <div id="fill-in-container" class="space-y-4 hidden">
                <input type="text" id="answer-input" placeholder="Type your answer here..."
                        class="w-full p-4 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none text-xl">
            </div>

            <p id="answer-error" class="text-error-text text-sm h-5 text-center"></p>

            <div class="mt-8 flex justify-between space-x-4">
                <button id="prev-btn" onclick="exam.goToPrevQuestion()"
                        class="bg-slate-600 hover:bg-slate-500 text-text-light font-semibold py-3 px-6 rounded-lg transition disabled:opacity-50"
                        disabled>Previous</button>
                <button id="next-btn" onclick="exam.checkAnswerAndAdvance()"
                        class="btn-primary text-text-light font-semibold py-3 px-6 rounded-lg shadow-lg transition disabled:opacity-50"
                        disabled>Next Question</button>
            </div>
        </div>

        <div id="results-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50 text-center">
            
            <div class="mb-8">
                <h2 id="thank-you-message" class="text-3xl font-bold text-primary mb-4 leading-tight"></h2>
                <p class="text-text-secondary">Your responses have been securely recorded.</p>
                
                <div class="mt-6 p-4 bg-slate-800 rounded-lg inline-block">
                    <p class="text-xs text-text-secondary uppercase tracking-widest mb-1">Exam Reference ID</p>
                    <p id="ref-id-display" class="text-lg font-mono text-primary font-bold tracking-wider">Generating...</p>
                </div>
            </div>

            <div class="flex justify-center">
                <button onclick="exam.resetApp()" class="btn-primary text-text-light font-semibold py-3 px-8 rounded-lg shadow-lg transition">
                    Start New Exam
                </button>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script type="module">
        // ---------- Firebase ----------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVDZPURarcDmSZTsQTUIs_8VxNLQrkSmc",
            authDomain: "examitops.firebaseapp.com",
            projectId: "examitops",
            storageBucket: "examitops.firebasestorage.app",
            messagingSenderId: "605108026221",
            appId: "1:605108026221:web:ad7f3147f5645c11cc3864",
            measurementId: "G-Y70D2ZDQHZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // ---------- QUESTIONS - Now loaded from CSV ----------
        let questions = []; 

        // ---------- Global State ----------
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let employeeName = '';
        let score = 0;

        // Keys must match the CSV column headers exactly
        const KEYS = { CATEGORY:'Category', QUESTION:'Question', A:'A', B:'B', C:'C', D:'D', CORRECT:'CorrectAnswer' };

        // ---------- DOM ----------
        const startScreen     = document.getElementById('start-screen');
        const quizScreen      = document.getElementById('quiz-screen');
        const resultsScreen   = document.getElementById('results-screen');
        const startStatus     = document.getElementById('start-status');
        const nextButton      = document.getElementById('next-btn');
        const prevButton      = document.getElementById('prev-btn');
        const answerInput     = document.getElementById('answer-input');
        const refIdDisplay    = document.getElementById('ref-id-display');
        const csvFileInput    = document.getElementById('csv-upload');

        // ---------- Helper ----------
        function calculateFinalScore() {
            return userAnswers.reduce((s, a) => s + (a.isCorrect ? 1 : 0), 0);
        }

        // ---------- Expose Functions Globally ----------
        const exam = {
            checkNameAndStart,
            startQuiz,
            goToPrevQuestion,
            checkAnswerAndAdvance,
            showResults,
            resetApp
        };
        window.exam = exam;

        // ----- CSV LOADING (NEW) -----
        function loadQuestionsFromCSV(file) {
            return new Promise((resolve, reject) => {
                Papa.parse(file, {
                    header: true, // Treat the first row as column headers
                    skipEmptyLines: true,
                    complete: (results) => {
                        // Filter out bad/empty data and ensure keys are present
                        const cleanQuestions = results.data.filter(q => q[KEYS.QUESTION] && q[KEYS.CORRECT]);
                        resolve(cleanQuestions);
                    },
                    error: (error) => {
                        reject(error);
                    }
                });
            });
        }


        // ----- START -----
        async function checkNameAndStart() {
            const name = document.getElementById('employee-name-input').value.trim();
            const csvFile = csvFileInput.files[0];
            
            if (!name) { startStatus.textContent = "Error: Please enter the employee's full name."; return; }
            if (!csvFile) { startStatus.textContent = "Error: Please upload the questions CSV file."; return; }
            
            employeeName = name;
            startStatus.textContent = '';
            
            try {
                // 1. Load questions from the uploaded CSV
                startStatus.textContent = "Loading questions...";
                questions = await loadQuestionsFromCSV(csvFile);

                if (questions.length === 0) {
                    startStatus.textContent = "Error: No questions found in the CSV file.";
                    return;
                }
                
                startStatus.textContent = ''; // Clear status on success
                exam.startQuiz();

            } catch(e) {
                console.error("CSV Loading Error:", e);
                startStatus.textContent = `Error loading questions: ${e.message || "Invalid CSV format."}`;
            }
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            // Initialize userAnswers based on the dynamically loaded questions
            userAnswers = questions.map(q => ({
                question: q[KEYS.QUESTION],
                category: q[KEYS.CATEGORY],
                // Check if options A, B, C, or D have content to determine MCQ vs Fill-in
                isMCQ: !!(q[KEYS.A].trim() || q[KEYS.B].trim() || q[KEYS.C].trim() || q[KEYS.D].trim()), 
                options: { A: q[KEYS.A], B: q[KEYS.B], C: q[KEYS.C], D: q[KEYS.D] },
                selected: null,
                correct: q[KEYS.CORRECT],
                isCorrect: false
            }));

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            displayQuestion();
        }

        // ----- DISPLAY -----
        function displayQuestion() {
            if (currentQuestionIndex >= questions.length) { exam.showResults(); return; }

            const q = questions[currentQuestionIndex];
            const attempt = userAnswers[currentQuestionIndex];
            const total = questions.length;

            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex+1}/${total}`;
            document.getElementById('question-text').textContent   = q[KEYS.QUESTION];
            document.getElementById('question-category').textContent = q[KEYS.CATEGORY] ? `Category: ${q[KEYS.CATEGORY]}` : 'Category: General';

            const opts = document.getElementById('options-container');
            const fill = document.getElementById('fill-in-container');
            const err  = document.getElementById('answer-error');

            opts.innerHTML = '';
            answerInput.value = '';
            err.textContent = '';

            if (attempt.isMCQ) {
                opts.classList.remove('hidden'); fill.classList.add('hidden');
                // Iterate through the options in the attempt object (which handles any missing keys gracefully)
                Object.keys(attempt.options).forEach(k => {
                    const text = attempt.options[k];
                    if (!text || text.trim() === '') return;
                    
                    const btn = document.createElement('button');
                    btn.textContent = `${k}. ${text}`;
                    btn.className = `option-button w-full text-left p-4 rounded-lg bg-slate-700 hover:bg-primary/50 transition shadow-md font-medium`;
                    // Highlight selected option
                    if (attempt.selected === k) {
                         btn.classList.remove('bg-slate-700','hover:bg-primary/50');
                         btn.className += ` bg-selection ring-2 ring-primary/50`;
                    }
                    btn.onclick = () => selectMCQAnswer(k);
                    btn.id = `option-${k}`;
                    opts.appendChild(btn);
                });
            } else {
                opts.classList.add('hidden'); fill.classList.remove('hidden');
                // Restore previous fill-in answer if available
                if (attempt.selected !== null) answerInput.value = attempt.selected;
                // Set the function to run every time the user types
                answerInput.oninput = submitFillInAnswer; 
            }

            updateNextButtonState();
            updateNavigationButtons();
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentQuestionIndex === 0;
            nextButton.textContent = currentQuestionIndex === questions.length-1 ? 'Finish Exam' : 'Next Question';
        }

        function updateNextButtonState() {
            const a = userAnswers[currentQuestionIndex];
            nextButton.disabled = !a || a.selected === null || a.selected.toString().trim() === '';
        }

        // ----- ANSWER HANDLING -----
        function selectMCQAnswer(key) {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            attempt.selected = key;
            attempt.isCorrect = key === q[KEYS.CORRECT];

            document.querySelectorAll('.option-button').forEach(b => {
                b.classList.remove('bg-selection','ring-2','ring-primary/50');
                b.classList.add('bg-slate-700','hover:bg-primary/50');
            });
            const sel = document.getElementById(`option-${key}`);
            if (sel) {
                sel.classList.add('bg-selection','ring-2','ring-primary/50');
                sel.classList.remove('bg-slate-700','hover:bg-primary/50');
            }

            updateNextButtonState();
        }

        function submitFillInAnswer() {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            const txt = answerInput.value.trim();
            attempt.selected = txt;
            
            if (txt) {
                // Allows for multiple possible correct answers separated by '|' in the CSV
                const correctAnswers = q[KEYS.CORRECT].split('|').map(c => c.trim().toLowerCase());
                const normalizedAnswer = txt.toLowerCase();
                attempt.isCorrect = correctAnswers.includes(normalizedAnswer);
            } else {
                attempt.isCorrect = false;
            }
            document.getElementById('answer-error').textContent = '';
            updateNextButtonState();
        }

        // ----- NAVIGATION -----
        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; displayQuestion(); }
        }

        function checkAnswerAndAdvance() {
            const attempt = userAnswers[currentQuestionIndex];
            if (!attempt || attempt.selected === null || attempt.selected.toString().trim() === '') {
                document.getElementById('answer-error').textContent = attempt.isMCQ ? 
                    'Please select an answer before moving to the next question.' : 
                    'Please enter an answer before moving to the next question.';
                return;
            }
            document.getElementById('answer-error').textContent = '';
            if (currentQuestionIndex < questions.length-1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                exam.showResults();
            }
        }

        // ----- RESULTS & FIREBASE -----
        async function sendResultsToDatabase() {
            const finalScore = calculateFinalScore();
            const total = questions.length;
            const percentage = total ? ((finalScore/total)*100).toFixed(1) : 0;
            const data = {
                employeeName,
                score: finalScore,
                total,
                percentage,
                timestamp: new Date().toISOString(),
                answers: userAnswers.map(a=>({
                    question: a.question,
                    category: a.category,
                    selected: a.selected,
                    correct: a.correct,
                    isCorrect: a.isCorrect
                }))
            };
            try {
                // Wait for the document to be added
                const docRef = await addDoc(collection(db, "examResults"), data);
                console.log("Results saved to Firestore with ID:", docRef.id);
                // RETURN THE ID
                return docRef.id;
            } catch (e) {
                console.error("Firestore error:", e);
                return null;
            }
        }

        function showResults() {
            const finalScore = calculateFinalScore();
            const total = questions.length;
            score = finalScore;

            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            document.getElementById('thank-you-message').textContent = `Thank you ${employeeName} for completing the exam.`;
            
            // Set Loading state for ID
            refIdDisplay.textContent = "Saving...";
            refIdDisplay.classList.add('animate-pulse');

            // Send to database and update UI with the returned ID
            sendResultsToDatabase().then(docId => {
                refIdDisplay.classList.remove('animate-pulse');
                if (docId) {
                    refIdDisplay.textContent = docId;
                    refIdDisplay.classList.add('text-primary');
                } else {
                    refIdDisplay.textContent = "Error saving results";
                    refIdDisplay.classList.add('text-error-text');
                }
            });
        }

        function resetApp() {
            currentQuestionIndex = 0; score = 0; userAnswers = []; employeeName = ''; questions = [];
            resultsScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startStatus.textContent = '';
            document.getElementById('employee-name-input').value = '';
            csvFileInput.value = ''; // Clear file input
            // Reset Ref ID style
            refIdDisplay.textContent = 'Generating...';
            refIdDisplay.classList.remove('text-error-text', 'text-primary');
        }
    </script>
</body>
</html>
