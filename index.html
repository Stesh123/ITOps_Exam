<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITOps Exam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'primary': '#4f46e5',
                            'secondary': '#1f2937',
                            'background': '#0f172a',
                            'card': '#1e293b',
                            'text-light': '#f1f5f9',
                            'text-secondary': '#94a3b8',
                            'selection': '#334155',
                            'error-text': '#f87171',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        /* Add a Hebrew font that supports non-breaking line breaks, like Rubik */
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap');

        :root { font-family: 'Inter', sans-serif; }
        .btn-primary {
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 15px rgba(79,70,229,.4);
            transition: all .3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #4f46e5, #3730a3);
            box-shadow: 0 6px 20px rgba(79,70,229,.6);
            transform: translateY(-2px);
        }
        .btn-primary:disabled, .btn-primary[disabled]{
            background:#334155; box-shadow:none; transform:none; cursor:not-allowed; opacity:.6;
        }
        /* New Style for Hebrew text alignment/direction */
        .hebrew-text {
            direction: rtl; /* Right-to-Left direction for Hebrew */
            text-align: right;
            /* Optionally use a Hebrew-friendly font */
            font-family: 'Rubik', 'Inter', sans-serif;
        }
        /* Override default option button text alignment for Hebrew questions */
        .hebrew-option .option-button {
            text-align: right;
        }
        /* Ensure the input/textarea field text starts on the right for RTL languages */
        #answer-input.hebrew-text {
            text-align: right;
        }
    </style>
</head>
<body class="bg-background text-text-light min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl">
        <h1 class="text-4xl font-extrabold text-center text-primary mb-10 tracking-wide">ITOps Exam</h1>
        
        <div class="text-center mb-4 text-text-secondary text-xs italic">
            Powered by the brilliant mind - Stas Shnaider, ITOps genius.
        </div>

        <div id="start-screen" class="bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <h2 class="text-2xl font-semibold mb-4 text-primary">Full Name</h2>
            <p class="text-text-secondary mb-6">Enter the employee's name to begin the technical assessment.</p>

            <input type="text" id="employee-name-input" placeholder="Enter Employee Full Name (Required)" 
                   class="w-full p-3 mb-6 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none">

            <p id="start-status" class="mt-4 text-center text-sm text-error-text h-5"></p>

            <button onclick="exam.checkNameAndStart()" class="btn-primary w-full text-text-light font-semibold py-3 rounded-lg shadow-lg mt-4">
                Start Exam
            </button>
        </div>

        <div id="quiz-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 class="text-xl font-semibold text-primary" id="question-number">Question 1/X</h2>
                <span id="current-score" class="text-base font-medium text-text-secondary px-3 py-1 bg-slate-700/50 rounded-full">Score: Hidden</span>
            </div>
            <div class="mb-10">
                <p id="question-text" class="text-2xl font-light mb-3"></p>
                <p id="question-category" class="text-sm text-primary/70 italic"></p>
            </div>

            <div id="options-container" class="space-y-4"></div>

            <div id="fill-in-container" class="space-y-4 hidden">
                <textarea id="answer-input" placeholder="Type your answer here... (Min 150 characters supported)"
                         class="w-full p-4 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none text-xl h-32"></textarea>
            </div>

            <p id="answer-error" class="text-error-text text-sm h-5 text-center"></p>

            <div class="mt-8 flex justify-between space-x-4">
                <button id="prev-btn" onclick="exam.goToPrevQuestion()"
                             class="bg-slate-600 hover:bg-slate-500 text-text-light font-semibold py-3 px-6 rounded-lg transition disabled:opacity-50"
                             disabled>Previous</button>
                <button id="next-btn" onclick="exam.checkAnswerAndAdvance()"
                             class="btn-primary text-text-light font-semibold py-3 px-6 rounded-lg shadow-lg transition disabled:opacity-50"
                             disabled>Next Question</button>
            </div>
        </div>

        <div id="results-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50 text-center">
            
            <div class="mb-8">
                <h2 id="thank-you-message" class="text-3xl font-bold text-primary mb-4 leading-tight"></h2>
                <p class="text-text-secondary">Your responses have been securely recorded.</p>
                
                <div class="mt-6 p-4 bg-slate-800 rounded-lg inline-block">
                    <p class="text-xs text-text-secondary uppercase tracking-widest mb-1">Exam Reference ID</p>
                    <p id="ref-id-display" class="text-lg font-mono text-primary font-bold tracking-wider">Generating...</p>
                </div>
            </div>

            <div class="flex justify-center">
                <button onclick="exam.resetApp()" class="btn-primary text-text-light font-semibold py-3 px-8 rounded-lg shadow-lg transition">
                    Start New Exam
                </button>
            </div>

        </div>
    </div>

    <script type="module">
        // ---------- Firebase ----------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVDZPURarcDmSZTsQTUIs_8VxNLQrkSmc",
            authDomain: "examitops.firebaseapp.com",
            projectId: "examitops",
            storageBucket: "examitops.firebasestorage.app",
            messagingSenderId: "605108026221",
            appId: "1:605108026221:web:ad7f3147f5645c11cc3864",
            measurementId: "G-Y70D2ZDQHZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // ---------- ALL 24 QUESTIONS ----------
        const questions = [
            
    // ================= IT (Mixed Hebrew/English for test) =================
    // Note: The first question has been cleaned up and flagged as Hebrew
    { Category: 'IT', Question: 'מהן הפעולות הראשונות שתבצע כדי לפתור תקלת אינטרנט במחשב של משתמש ששאר הרשת תקינה?', A: 'בדיקת פינג לכתובת ה-Default Gateway', B: 'אתחול ה-PC והראוטר', C: 'בדיקת מצב מתאם הרשת (ipconfig)', D: 'שחזור המערכת לנקודת זמן קודמת', CorrectAnswer: 'A', Language: 'Hebrew' },
    { Category: 'IT', Question: 'A user reports they cannot print to a network printer, but other users can. What is the most likely first step to troubleshoot the issue on the user\'s PC?', A: 'Restart the print spooler service', B: 'Check the printer\'s IP address', C: 'Reinstall the operating system', D: 'Replace the printer cable', CorrectAnswer: 'A', Language: 'English' },
    { Category: 'IT', Question: 'Which key combination opens the Task Manager in Windows?', A: 'Ctrl + Alt + F4', B: 'Alt + Shift + Del', C: 'Ctrl + Shift + Esc', D: 'Windows Key + R', CorrectAnswer: 'C', Language: 'English' },
    { Category: 'IT', Question: 'What is the purpose of DHCP in a local network?', A: 'Translates domain names to IP addresses', B: 'Manages all network security policies', C: 'Automatically assigns IP addresses to devices', D: 'Encrypts all network traffic', CorrectAnswer: 'C', Language: 'English' },
    { Category: 'IT', Question: 'Name the command-line utility in Windows used to test the reachability of a host on an IP network.', A: '', B: '', C: '', D: '', CorrectAnswer: 'ping', Language: 'English' },

    // ================= LINUX =================
    { Category: 'Linux', Question: 'Which command is used to display the contents of a text file, one screenful at a time?', A: 'cat', B: 'grep', C: 'less', D: 'tail', CorrectAnswer: 'C', Language: 'English' },
    { Category: 'Linux', Question: 'Which file contains the list of local user accounts on a standard Linux system?', A: '/etc/group', B: '/var/log/messages', C: '/etc/passwd', D: '/boot/grub/grub.cfg', CorrectAnswer: 'C', Language: 'English' },
    { Category: 'Linux', Question: 'מהי הפקודה המשמשת לשנות את הבעלות על קובץ (משתמש וקבוצה)?', A: 'chmod', B: 'chgrp', C: 'chown', D: 'ln', CorrectAnswer: 'C', Language: 'Hebrew' },
    { Category: 'Linux', Question: 'What does the --rwxr-x--- file permission string mean for the **Group** category?', A: 'Read, Write, and Execute', B: 'Read and Execute', C: 'Read only', D: 'No permissions', CorrectAnswer: 'B', Language: 'English' },
    { Category: 'Linux', Question: 'Name the command used to check the running processes on a Linux system.', A: '', B: '', C: '', D: '', CorrectAnswer: 'ps (or top)', Language: 'English' },

    // ================= VMWARE =================
    { Category: 'VMware', Question: 'Which component of the vSphere suite manages the central control plane, allowing you to manage multiple ESXi hosts?', A: 'vCenter Server', B: 'vSphere Client', C: 'vSAN', D: 'vMotion', CorrectAnswer: 'A', Language: 'English' },
    { Category: 'VMware', Question: 'What is the file extension for a VMware virtual disk file?', A: '.vmx', B: '.vmdk', C: '.vswp', D: '.nvram', CorrectAnswer: 'B', Language: 'English' },
    { Category: 'VMware', Question: 'Which feature allows you to move a running virtual machine from one ESXi host to another without downtime?', A: 'Storage vMotion', B: 'High Availability (HA)', C: 'Distributed Resource Scheduler (DRS)', D: 'vMotion', CorrectAnswer: 'D', Language: 'English' },
    { Category: 'VMware', Question: 'What is a Snapshot used for in a virtual machine environment?', A: 'To create a full backup of the VM', B: 'To capture the state, settings, and data of a VM at a specific point in time', C: 'To replicate the VM to a secondary site', D: 'To increase the VM\'s performance', CorrectAnswer: 'B', Language: 'English' },
    { Category: 'VMware', Question: 'Describe, in detail, the difference between VMware HA (High Availability) and FT (Fault Tolerance) and when you would use each.', A: '', B: '', C: '', D: '', CorrectAnswer: 'HA provides automatic restart after failure, causing brief downtime. FT provides continuous availability with zero downtime using a mirrored secondary VM. Use HA for most workloads; use FT only for mission-critical apps that cannot tolerate any downtime.', Language: 'English' },

    // ================= NETWORK =================
    { Category: 'Network', Question: 'In the OSI Model, which layer is responsible for logical addressing (IP addresses)?', A: 'Layer 2 (Data Link)', B: 'Layer 3 (Network)', C: 'Layer 4 (Transport)', D: 'Layer 7 (Application)', CorrectAnswer: 'B', Language: 'English' },
    { Category: 'Network', Question: 'Which device operates primarily at Layer 2 of the OSI model and forwards data based on MAC addresses?', A: 'Router', B: 'Hub', C: 'Firewall', D: 'Switch', CorrectAnswer: 'D', Language: 'English' },
    { Category: 'Network', Question: 'מהו הפורט הנפוץ ביותר המשמש את פרוטוקול RDP (Remote Desktop Protocol) לצורך גישה מרחוק?', A: '22', B: '3389', C: '8080', D: '23', CorrectAnswer: 'B', Language: 'Hebrew' },
    { Category: 'Network', Question: 'What is the purpose of a subnet mask in an IPv4 network?', A: 'To identify the default gateway', B: 'To distinguish the network portion from the host portion of an IP address', C: 'To encrypt the network traffic', D: 'To assign IP addresses dynamically', CorrectAnswer: 'B', Language: 'English' },
    { Category: 'Network', Question: 'Name the command-line utility used to view the IP configuration (IP address, subnet mask, default gateway) of a network adapter on a Windows machine.', A: '', B: '', C: '', D: '', CorrectAnswer: 'ipconfig', Language: 'English' }
        ];

        // ---------- Global State ----------
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let employeeName = '';
        let score = 0;

        const KEYS = { QUESTION:'Question', CATEGORY:'Category', A:'A', B:'B', C:'C', D:'D', CORRECT:'CorrectAnswer', LANGUAGE: 'Language' };

        // ---------- DOM ----------
        const startScreen   = document.getElementById('start-screen');
        const quizScreen    = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const startStatus   = document.getElementById('start-status');
        const nextButton    = document.getElementById('next-btn');
        const prevButton    = document.getElementById('prev-btn');
        const answerInput   = document.getElementById('answer-input'); // This is now a TEXTAREA
        const refIdDisplay  = document.getElementById('ref-id-display');

        // ---------- Helper ----------
        function calculateFinalScore() {
            return userAnswers.reduce((s, a) => s + (a.isCorrect ? 1 : 0), 0);
        }
        
        // Helper to check if the question is in Hebrew
        function isHebrew(q) {
            return q[KEYS.LANGUAGE] === 'Hebrew';
        }

        // ---------- Expose Functions Globally ----------
        const exam = {
            checkNameAndStart,
            startQuiz,
            goToPrevQuestion,
            checkAnswerAndAdvance,
            showResults,
            resetApp
        };
        window.exam = exam;

        // ----- START -----
        function checkNameAndStart() {
            const name = document.getElementById('employee-name-input').value.trim();
            if (!name) { startStatus.textContent = "Error: Please enter the employee's full name."; return; }
            employeeName = name;
            startStatus.textContent = '';
            exam.startQuiz();
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            // When initializing userAnswers, we save the OPTIONS here, making them available later.
            userAnswers = questions.map(q => ({
                question: q[KEYS.QUESTION],
                category: q[KEYS.CATEGORY],
                isMCQ: !!q[KEYS.A].trim(),
                // Store the full options text here
                options: { A:q[KEYS.A], B:q[KEYS.B], C:q[KEYS.C], D:q[KEYS.D] }, 
                selected: null,
                correct: q[KEYS.CORRECT],
                isCorrect: false,
                language: q[KEYS.LANGUAGE] // Store language property
            }));

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            displayQuestion();
        }

        // ----- DISPLAY -----
        function displayQuestion() {
            if (currentQuestionIndex >= questions.length) { exam.showResults(); return; }

            const q = questions[currentQuestionIndex];
            const attempt = userAnswers[currentQuestionIndex];
            const total = questions.length;
            const isQHebrew = isHebrew(q); // Check language for current question

            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex+1}/${total}`;
            
            // Apply Hebrew/RTL class to question text
            const questionTextEl = document.getElementById('question-text');
            questionTextEl.textContent = q[KEYS.QUESTION];
            if (isQHebrew) {
                questionTextEl.classList.add('hebrew-text');
            } else {
                questionTextEl.classList.remove('hebrew-text');
            }


            document.getElementById('question-category').textContent = q[KEYS.CATEGORY] ? `Category: ${q[KEYS.CATEGORY]}` : 'Category: General';

            const opts = document.getElementById('options-container');
            const fill = document.getElementById('fill-in-container');
            const err  = document.getElementById('answer-error');

            opts.innerHTML = '';
            answerInput.value = '';
            err.textContent = '';

            // Apply Hebrew/RTL class to options container/fill-in container
            if (isQHebrew) {
                opts.classList.add('hebrew-option');
                answerInput.classList.add('hebrew-text');
            } else {
                opts.classList.remove('hebrew-option');
                answerInput.classList.remove('hebrew-text');
            }


            if (attempt.isMCQ) {
                opts.classList.remove('hidden'); fill.classList.add('hidden');
                ['A','B','C','D'].forEach(k => {
                    if (!q[k]) return;
                    const btn = document.createElement('button');
                    btn.textContent = `${k}. ${q[k]}`;
                    
                    // Determine button class based on language
                    let btnClass = `option-button w-full p-4 rounded-lg bg-slate-700 hover:bg-primary/50 transition shadow-md font-medium`;
                    if (isQHebrew) {
                         btnClass += ' text-right'; // Override default text-left for Hebrew options
                    } else {
                         btnClass += ' text-left';
                    }

                    if (attempt.selected === k) btnClass = btnClass.replace('bg-slate-700','bg-selection ring-2 ring-primary/50');
                    
                    btn.className = btnClass;
                    btn.onclick = () => selectMCQAnswer(k);
                    btn.id = `option-${k}`;
                    opts.appendChild(btn);
                });
            } else {
                opts.classList.add('hidden'); fill.classList.remove('hidden');
                if (attempt.selected !== null) answerInput.value = attempt.selected;
                answerInput.oninput = submitFillInAnswer;
            }

            updateNextButtonState();
            updateNavigationButtons();
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentQuestionIndex === 0;
            nextButton.textContent = currentQuestionIndex === questions.length-1 ? 'Finish Exam' : 'Next Question';
        }

        function updateNextButtonState() {
            const a = userAnswers[currentQuestionIndex];
            nextButton.disabled = !a || a.selected === null || a.selected.toString().trim() === '';
        }

        // ----- ANSWER HANDLING -----
        function selectMCQAnswer(key) {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            attempt.selected = key;
            attempt.isCorrect = key === q[KEYS.CORRECT];

            document.querySelectorAll('.option-button').forEach(b => {
                b.classList.remove('bg-selection','ring-2','ring-primary/50');
                b.classList.add('bg-slate-700','hover:bg-primary/50');
            });
            const sel = document.getElementById(`option-${key}`);
            if (sel) sel.classList.add('bg-selection','ring-2','ring-primary/50');

            updateNextButtonState();
        }

        function submitFillInAnswer() {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            const txt = answerInput.value.trim();
            attempt.selected = txt;
            if (txt) {
                // NOTE: For open-ended questions, the scoring is basic (text match) 
                // and will usually be reviewed manually. We keep the basic matching for now.
                const norm = txt.toLowerCase().split('|').map(c=>c.trim().toLowerCase()).filter(Boolean); // Handle multiple correct answers
                const correct = q[KEYS.CORRECT].toLowerCase().split('|').map(c=>c.trim().toLowerCase());
                
                // Simple check for now: Is the selected answer one of the accepted correct answers?
                attempt.isCorrect = correct.some(c => norm.includes(c)); 
            } else {
                attempt.isCorrect = false;
            }
            document.getElementById('answer-error').textContent = '';
            updateNextButtonState();
        }

        // ----- NAVIGATION -----
        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; displayQuestion(); }
        }

        function checkAnswerAndAdvance() {
            const attempt = userAnswers[currentQuestionIndex];
            if (!attempt || attempt.selected === null || attempt.selected.toString().trim() === '') {
                document.getElementById('answer-error').textContent = attempt.isMCQ ? 
                    'Please select an answer before moving to the next question.' : 
                    'Please enter an answer before moving to the next question.';
                return;
            }
            document.getElementById('answer-error').textContent = '';
            if (currentQuestionIndex < questions.length-1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                exam.showResults();
            }
        }

        // ----- RESULTS & FIREBASE -----
        async function sendResultsToDatabase() {
            const finalScore = calculateFinalScore();
            const total = questions.length;
            const percentage = total ? ((finalScore/total)*100).toFixed(1) : 0;
            
            // CRITICAL CHANGE HERE: Include the 'options' object in the data sent to Firestore
            const answersData = userAnswers.map(a => ({
                question: a.question,
                category: a.category,
                isMCQ: a.isMCQ,
                options: a.options, // <--- This stores A, B, C, D text
                selected: a.selected,
                correct: a.correct,
                isCorrect: a.isCorrect,
                language: a.language // New field
            }));
            
            const data = {
                employeeName,
                score: finalScore,
                total,
                percentage,
                timestamp: new Date().toISOString(),
                answers: answersData 
            };
            
            try {
                // Wait for the document to be added
                const docRef = await addDoc(collection(db, "examResults"), data);
                console.log("Results saved to Firestore with ID:", docRef.id);
                // RETURN THE ID
                return docRef.id;
            } catch (e) {
                console.error("Firestore error:", e);
                return null;
            }
        }

        function showResults() {
            const finalScore = calculateFinalScore();
            const total = questions.length;
            score = finalScore;

            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            document.getElementById('thank-you-message').textContent = `Thank you ${employeeName} for completing the exam.`;
            
            // Set Loading state for ID
            refIdDisplay.textContent = "Saving...";
            refIdDisplay.classList.add('animate-pulse');

            // Send to database and update UI with the returned ID
            sendResultsToDatabase().then(docId => {
                refIdDisplay.classList.remove('animate-pulse');
                if (docId) {
                    refIdDisplay.textContent = docId;
                    refIdDisplay.classList.add('text-primary');
                } else {
                    refIdDisplay.textContent = "Error saving results";
                    refIdDisplay.classList.add('text-error-text');
                }
            });
        }

        function resetApp() {
            currentQuestionIndex = 0; score = 0; userAnswers = []; employeeName = '';
            resultsScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startStatus.textContent = '';
            document.getElementById('employee-name-input').value = '';
            // Reset Ref ID style
            refIdDisplay.textContent = 'Generating...';
            refIdDisplay.classList.remove('text-error-text', 'text-primary');
        }
    </script>
</body>
</html>
