<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITOps Exam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            'primary': '#4f46e5',
                            'secondary': '#1f2937',
                            'background': '#0f172a',
                            'card': '#1e293b',
                            'text-light': '#f1f5f9',
                            'text-secondary': '#94a3b8',
                            'selection': '#334155',
                            'error-text': '#f87171',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root { font-family: 'Inter', sans-serif; }
        .btn-primary {
            background: linear-gradient(145deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 15px rgba(79,70,229,.4);
            transition: all .3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #4f46e5, #3730a3);
            box-shadow: 0 6px 20px rgba(79,70,229,.6);
            transform: translateY(-2px);
        }
        .btn-primary:disabled, .btn-primary[disabled]{
            background:#334155; box-shadow:none; transform:none; cursor:not-allowed; opacity:.6;
        }
    </style>
</head>
<body class="bg-background text-text-light min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl">
        <h1 class="text-4xl font-extrabold text-center text-primary mb-10 tracking-wide">ITOps Exam</h1>
        
        <div class="text-center mb-4 text-text-secondary text-xs italic">
            Powered by the brilliant mind - Stas Shnaider, ITOps genius.
        </div>

        <div id="start-screen" class="bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <h2 class="text-2xl font-semibold mb-4 text-primary">Full Name</h2>
            <p class="text-text-secondary mb-6">Enter your full name to begin the technical assessment.</p>

            <input type="text" id="employee-name-input" placeholder="Enter your Full Name (Required)" 
                    class="w-full p-3 mb-6 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none">

            <p id="start-status" class="mt-4 text-center text-sm text-error-text h-5"></p>

            <button onclick="exam.checkNameAndStart()" class="btn-primary w-full text-text-light font-semibold py-3 rounded-lg shadow-lg mt-4">
                Start Exam
            </button>
        </div>

        <div id="quiz-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 class="text-xl font-semibold text-primary" id="question-number">Question 1/X</h2>
                <span id="current-score" class="text-base font-medium text-text-secondary px-3 py-1 bg-slate-700/50 rounded-full">Score: Hidden</span>
            </div>
            <div class="mb-10">
                <p id="question-text" class="text-2xl font-light mb-3"></p>
                <p id="question-category" class="text-sm text-primary/70 italic"></p>
            </div>

            <div id="options-container" class="space-y-4"></div>

            <div id="fill-in-container" class="space-y-4 hidden">
                <textarea id="answer-input" placeholder="Type your answer here..." rows="5"
                    class="w-full p-4 rounded-lg bg-slate-700 text-text-light border border-slate-600 focus:ring-primary focus:border-primary placeholder-slate-400 focus:outline-none text-xl resize-y"></textarea>
            </div>

            <p id="answer-error" class="text-error-text text-sm h-5 text-center"></p>

            <div class="mt-8 flex justify-between space-x-4">
                <button id="prev-btn" onclick="exam.goToPrevQuestion()"
                             class="bg-slate-600 hover:bg-slate-500 text-text-light font-semibold py-3 px-6 rounded-lg transition disabled:opacity-50"
                             disabled>Previous</button>
                <button id="next-btn" onclick="exam.checkAnswerAndAdvance()"
                             class="btn-primary text-text-light font-semibold py-3 px-6 rounded-lg shadow-lg transition disabled:opacity-50"
                             disabled>Next Question</button>
            </div>
        </div>

        <div id="results-screen" class="hidden bg-card shadow-2xl rounded-2xl p-10 border border-slate-700/50 text-center">
            
            <div class="mb-8">
                <h2 id="thank-you-message" class="text-3xl font-bold text-primary mb-4 leading-tight"></h2>
                <p class="text-text-secondary">Your responses have been securely recorded.</p>
                
                <div class="mt-6 p-4 bg-slate-800 rounded-lg inline-block">
                    <p class="text-xs text-text-secondary uppercase tracking-widest mb-1">Exam Reference ID</p>
                    <p id="ref-id-display" class="text-lg font-mono text-primary font-bold tracking-wider">Generating...</p>
                </div>
            </div>

            <div class="flex justify-center">
                <button onclick="exam.resetApp()" class="btn-primary text-text-light font-semibold py-3 px-8 rounded-lg shadow-lg transition">
                    Start New Exam
                </button>
            </div>

        </div>
    </div>

    <script type="module">
        // ---------- Firebase ----------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVDZPURarcDmSZTsQTUIs_8VxNLQrkSmc",
            authDomain: "examitops.firebaseapp.com",
            projectId: "examitops",
            storageBucket: "examitops.firebasestorage.app",
            messagingSenderId: "605108026221",
            appId: "1:605108026221:web:ad7f3147f5645c11cc3864",
            measurementId: "G-Y70D2ZDQHZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // ---------- ALL 24 QUESTIONS ----------
        const questions = [
            // ================= IT ARCHITECT =================
            { Category: 'IT', Question: 'What is RAID and which RAID levels do you know What is RAID and which RAID levels do you know What is RAID and which RAID levels do you know What is RAID and which RAID levels do you know What is RAID and which RAID levels do you know?', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID3' },
            { Category: 'IT', Question: 'What is MSTSC?', A: 'Windows task scheduler', B: 'Remote desktop client', C: 'Microsoft SQL Server', D: 'Network monitoring tool', CorrectAnswer: 'B' },
            { Category: 'IT', Question: 'What is BitLocker and what is its purpose?', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID3' },
            { Category: 'IT', Question: 'What is DiskPart and in which use cases would you need to use it?', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID3' },
            { Category: 'IT', Question: 'You need to clone a disk. Which tools can you use and why?', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID3' },
            { Category: 'IT', Question: 'Which port does HTTPS use by default?', A: '20', B: '80', C: '443', D: '8080', CorrectAnswer: 'C' },
            { Category: 'IT', Question: 'What is iLO / iDRAC? What is it used for?', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID3' },
            { Category: 'IT', Question: 'Explain what DNS does.', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID3' },
            { Category: 'IT', Question: 'Explain the difference between SSD and HDD.', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID3' },
            { Category: 'IT', Question: 'Which RAID level provides mirroring?', A: 'RAID 0', B: 'RAID 1', C: 'RAID 5', D: 'RAID 3', CorrectAnswer: 'B' },


            // ================= LINUX =================
            { Category: 'Linux', Question: 'How do you check which directory you are currently in?', A: '', B: '', C: '', D: '', CorrectAnswer: 'pwd' },
            { Category: 'Linux', Question: 'Which command is used to edit text files in terminal?', A: 'ifconfig', B: 'nano', C: 'ps', D: 'mkdir', CorrectAnswer: 'B' },
            { Category: 'Linux', Question: 'What command is used to move or rename files??', A: '', B: '', C: '', D: '', CorrectAnswer: 'mv' },
            { Category: 'Linux', Question: 'Which command shows system resource usage (CPU, RAM)?', A: 'ls', B: 'df', C: 'top', D: 'lscpu', CorrectAnswer: 'C' },
            { Category: 'Linux', Question: 'Which directory contains system logs in Linux?', A: '/run', B: '/etc', C: '/var/log', D: '/logs', CorrectAnswer: 'C' },

            // ================= VMWARE =================
            { Category: 'VMware', Question: 'What is a VMDK file and what is it used for?', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID 3' },
            { Category: 'VMware', Question: 'Explain what vCenter Server is and why you need it when managing multiple ESXi hosts.', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID 3' },
            { Category: 'VMware', Question: 'Which file stores the VM’s hardware configuration?', A: 'VMDK', B: 'VMX', C: 'VMSN', D: 'DRS', CorrectAnswer: 'B' },
            { Category: 'VMware', Question: 'What is the purpose of VMware Tools and why should it be installed on VMs?', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID 3' },
            { Category: 'VMware', Question: 'What is vMotion?', A: 'Migrating VMs with no downtime', B: 'Increasing VM RAM', C: 'A backup method', D: 'A load balancer', CorrectAnswer: 'A' },
            { Category: 'VMware', Question: 'Describe how you would connect several ESXi hosts to shared storage.', A: '', B: '', C: '', D: '', CorrectAnswer: 'RAID 3' },
            { Category: 'VMware', Question: 'What is a VM snapshot?', A: 'A full backup of the VM', B: 'A saved state of a VM at a specific point in time', C: 'A clone of the VM', D: 'A monitoring tool', CorrectAnswer: 'B' },
            

            // ================= NETWORK =================
            { Category: 'Network', Question: 'Which routing protocol uses Dijkstra’s SPF algorithm and supports areas for scalability?', A: 'RIP', B: 'BGP', C: 'EIGRP', D: 'OSPF', CorrectAnswer: 'D' },
            { Category: 'Network', Question: 'Name the BGP attribute that determines the preferred exit point from an AS.', A: '', B: '', C: '', D: '', CorrectAnswer: 'LOCAL_PREF' },
        ];

        // ---------- Global State ----------
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let employeeName = '';
        let score = 0; // This variable is now less critical as the score is calculated dynamically

        const KEYS = { QUESTION:'Question', CATEGORY:'Category', A:'A', B:'B', C:'C', D:'D', CORRECT:'CorrectAnswer' };

        // ---------- DOM ----------
        const startScreen   = document.getElementById('start-screen');
        const quizScreen    = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const startStatus   = document.getElementById('start-status');
        const nextButton    = document.getElementById('next-btn');
        const prevButton    = document.getElementById('prev-btn');
        const answerInput   = document.getElementById('answer-input'); 
        const refIdDisplay  = document.getElementById('ref-id-display');

        // ---------- Helper ----------
        function getMcqCount() {
            // Calculates the total number of scorable questions (MCQs)
            return userAnswers.filter(a => a.isMCQ).length;
        }

        function calculateFinalScore() {
            // ONLY scores questions that are both correct AND are MCQs.
            return userAnswers.reduce((s, a) => s + (a.isCorrect && a.isMCQ ? 1 : 0), 0);
        }

        // ---------- Expose Functions Globally ----------
        const exam = {
            checkNameAndStart,
            startQuiz,
            goToPrevQuestion,
            checkAnswerAndAdvance,
            showResults,
            resetApp
        };
        window.exam = exam;

        // ----- START -----
        function checkNameAndStart() {
            const name = document.getElementById('employee-name-input').value.trim();
            if (!name) { startStatus.textContent = "Error: Please enter the employee's full name."; return; }
            employeeName = name;
            startStatus.textContent = '';
            exam.startQuiz();
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            // When initializing userAnswers, we save the OPTIONS here, making them available later.
            userAnswers = questions.map(q => ({
                question: q[KEYS.QUESTION],
                category: q[KEYS.CATEGORY],
                // isMCQ determined by having text in option A
                isMCQ: !!q[KEYS.A].trim(), 
                // Store the full options text here
                options: { A:q[KEYS.A], B:q[KEYS.B], C:q[KEYS.C], D:q[KEYS.D] }, 
                selected: null,
                correct: q[KEYS.CORRECT],
                isCorrect: false
            }));

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            displayQuestion();
        }

        // ----- DISPLAY -----
        function displayQuestion() {
            if (currentQuestionIndex >= questions.length) { exam.showResults(); return; }

            const q = questions[currentQuestionIndex];
            const attempt = userAnswers[currentQuestionIndex];
            const total = questions.length;

            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex+1}/${total}`;
            document.getElementById('question-text').textContent   = q[KEYS.QUESTION];
            document.getElementById('question-category').textContent = q[KEYS.CATEGORY] ? `Category: ${q[KEYS.CATEGORY]}` : 'Category: General';

            const opts = document.getElementById('options-container');
            const fill = document.getElementById('fill-in-container');
            const err  = document.getElementById('answer-error');

            opts.innerHTML = '';
            // NOTE: answerInput is now a <textarea>
            answerInput.value = '';
            err.textContent = '';

            if (attempt.isMCQ) {
                opts.classList.remove('hidden'); fill.classList.add('hidden');
                ['A','B','C','D'].forEach(k => {
                    if (!q[k]) return;
                    const btn = document.createElement('button');
                    btn.textContent = `${k}. ${q[k]}`;
                    btn.className = `option-button w-full text-left p-4 rounded-lg bg-slate-700 hover:bg-primary/50 transition shadow-md font-medium`;
                    if (attempt.selected === k) btn.className = `option-button w-full text-left p-4 rounded-lg bg-selection ring-2 ring-primary/50 transition shadow-md font-medium`;
                    btn.onclick = () => selectMCQAnswer(k);
                    btn.id = `option-${k}`;
                    opts.appendChild(btn);
                });
            } else {
                opts.classList.add('hidden'); fill.classList.remove('hidden');
                // Use .toString() in case the stored selected value is non-string (e.g., old code had 'null' or a number)
                if (attempt.selected !== null) answerInput.value = attempt.selected.toString(); 
                // Since this is a textarea for free-form input, we check for updates on 'input' event.
                answerInput.oninput = submitFillInAnswer;
                // Run once on display to ensure the current value (if re-displaying) updates the next button state.
                submitFillInAnswer(); 
            }

            updateNextButtonState();
            updateNavigationButtons();
        }

        function updateNavigationButtons() {
            prevButton.disabled = currentQuestionIndex === 0;
            nextButton.textContent = currentQuestionIndex === questions.length-1 ? 'Finish Exam' : 'Next Question';
        }

        function updateNextButtonState() {
            const a = userAnswers[currentQuestionIndex];
            // The logic remains to check for null or empty string after trimming.
            nextButton.disabled = !a || a.selected === null || a.selected.toString().trim() === '';
        }

        // ----- ANSWER HANDLING -----
        function selectMCQAnswer(key) {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            attempt.selected = key;
            // MCQ scoring logic is handled here
            attempt.isCorrect = key === q[KEYS.CORRECT]; 

            document.querySelectorAll('.option-button').forEach(b => {
                b.classList.remove('bg-selection','ring-2','ring-primary/50');
                b.classList.add('bg-slate-700','hover:bg-primary/50');
            });
            const sel = document.getElementById(`option-${key}`);
            if (sel) sel.classList.add('bg-selection','ring-2','ring-primary/50');

            updateNextButtonState();
        }

        function submitFillInAnswer() {
            const attempt = userAnswers[currentQuestionIndex];
            const q = questions[currentQuestionIndex];
            // No changes needed here, .value is correct for both <input> and <textarea>
            const txt = answerInput.value.trim(); 
            attempt.selected = answerInput.value; // Store the full text, including new lines, but check for validity using trimmed value
            if (txt) {
                const norm = txt.toLowerCase();
                // Assumes correct answer for fill-in is case-insensitive match for the first value in the pipe-separated string
                const correct = q[KEYS.CORRECT].split('|').map(c=>c.trim().toLowerCase()); 
                // Fill-in answers are still marked as correct/incorrect in the object
                attempt.isCorrect = correct.includes(norm); 
            } else {
                attempt.isCorrect = false;
            }
            document.getElementById('answer-error').textContent = '';
            updateNextButtonState();
        }

        // ----- NAVIGATION -----
        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; displayQuestion(); }
        }

        function checkAnswerAndAdvance() {
            const attempt = userAnswers[currentQuestionIndex];
            if (!attempt || attempt.selected === null || attempt.selected.toString().trim() === '') {
                document.getElementById('answer-error').textContent = attempt.isMCQ ? 
                    'Please select an answer before moving to the next question.' : 
                    'Please enter an answer before moving to the next question.';
                return;
            }
            document.getElementById('answer-error').textContent = '';
            if (currentQuestionIndex < questions.length-1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                exam.showResults();
            }
        }

        // ----- RESULTS & FIREBASE -----
        async function sendResultsToDatabase() {
            const finalScore = calculateFinalScore();
            const mcqCount = getMcqCount(); // The new denominator for scoring
            const totalQuestions = questions.length;
            const percentage = mcqCount ? ((finalScore/mcqCount)*100).toFixed(1) : 0;
            
            // --- CRITICAL CHANGE HERE: Include the 'options' object in the data sent to Firestore
            const answersData = userAnswers.map(a => ({
                question: a.question,
                category: a.category,
                isMCQ: a.isMCQ,
                options: a.options, 
                selected: a.selected,
                correct: a.correct,
                isCorrect: a.isCorrect
            }));
            
            const data = {
                employeeName,
                score: finalScore,
                total: mcqCount, // Changed 'total' to reflect the number of scorable questions (MCQs)
                totalQuestions: totalQuestions, // Added for full context
                percentage,
                timestamp: new Date().toISOString(),
                answers: answersData // Use the modified answers array
            };
            
            try {
                // Wait for the document to be added
                const docRef = await addDoc(collection(db, "examResults"), data);
                console.log("Results saved to Firestore with ID:", docRef.id);
                // RETURN THE ID
                return docRef.id;
            } catch (e) {
                console.error("Firestore error:", e);
                return null;
            }
        }

        function showResults() {
            const finalScore = calculateFinalScore();
            score = finalScore;

            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            document.getElementById('thank-you-message').textContent = `Thank you ${employeeName} for completing the exam.`;
            
            // Set Loading state for ID
            refIdDisplay.textContent = "Saving...";
            refIdDisplay.classList.add('animate-pulse');

            // Send to database and update UI with the returned ID
            sendResultsToDatabase().then(docId => {
                refIdDisplay.classList.remove('animate-pulse');
                if (docId) {
                    refIdDisplay.textContent = docId;
                    refIdDisplay.classList.add('text-primary');
                } else {
                    refIdDisplay.textContent = "Error saving results";
                    refIdDisplay.classList.add('text-error-text');
                }
            });
        }

        function resetApp() {
            currentQuestionIndex = 0; score = 0; userAnswers = []; employeeName = '';
            resultsScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startStatus.textContent = '';
            document.getElementById('employee-name-input').value = '';
            // Reset Ref ID style
            refIdDisplay.textContent = 'Generating...';
            refIdDisplay.classList.remove('text-error-text', 'text-primary');
        }
    </script>
</body>
</html>
